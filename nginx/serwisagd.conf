# Nginx reverse proxy do Next.js (PM2 na porcie 3000).
# Skopiuj do /etc/nginx/sites-available/serwisagd i włącz symlinkiem w sites-enabled.
# Potem: nginx -t && systemctl reload nginx
#
# Certyfikat SSL ustaw według serwera (Let's Encrypt / panel hostingowy).

upstream serwisagd_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.serwisagd.swiebodzin.pl serwisagd.swiebodzin.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.serwisagd.swiebodzin.pl$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name serwisagd.swiebodzin.pl;

    # ssl_certificate     /etc/letsencrypt/live/www.serwisagd.swiebodzin.pl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.serwisagd.swiebodzin.pl/privkey.pem;

    return 301 https://www.serwisagd.swiebodzin.pl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.serwisagd.swiebodzin.pl;

    # ssl_certificate     /etc/letsencrypt/live/www.serwisagd.swiebodzin.pl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.serwisagd.swiebodzin.pl/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://serwisagd_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
